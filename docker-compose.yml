services:
  db:
    image: postgres:16-alpine
    container_name: readvault-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: readvault
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - readvault_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d readvault"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  readvault_db_data:
